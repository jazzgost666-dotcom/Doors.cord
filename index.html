    // Componente auxiliar para renderizar ícones Lucide SVG sem dependências de bundler
    function LucideIcon({ name, className = "w-5 h-5" }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (!containerRef.current || !window.lucide) return;
        const iconDef = window.lucide.icons[name];
        if (!iconDef) return;
        const svgElement = window.lucide.createElement(iconDef);
        svgElement.setAttribute("class", className);
        containerRef.current.innerHTML = "";
        containerRef.current.appendChild(svgElement);
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" />;
    }

    function generateTag(uid = '') {
      let hash = 0;
      for (let i = 0; i < uid.length; i++) {
        hash = (hash * 31 + uid.charCodeAt(i)) % 9000;
      }
      return String(1000 + Math.abs(hash)).slice(0, 4);
    }

    function generateInviteCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = 'DC-';
      for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function getDmRoomId(uidA, uidB) {

    function formatTimestamp(ts) {
      if (!ts) return 'Agora';
      const date = ts?.toDate ? ts.toDate() : new Date(ts);
      if (isNaN(date.getTime())) return 'Agora';
      return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function compressImageFromPC(file, maxSize = 256, quality = 0.85) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith('image/')) {
          reject(new Error('Selecione apenas arquivos de imagem válidos.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxSize) { h = Math.round((h * maxSize) / w); w = maxSize; }
            } else {
              if (h > maxSize) { w = Math.round((w * maxSize) / h); h = maxSize; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('Erro ao processar a imagem.'));
          img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error('Erro ao ler o arquivo do computador.'));
        reader.readAsDataURL(file);
      });
    }

    function UserAvatar({ profile, size = 'md', showStatus = false, accentHex = '#5865F2', speaking = false }) {
      const sizeClasses = { sm: 'w-8 h-8 text-xs', md: 'w-10 h-10 text-sm', lg: 'w-16 h-16 text-xl' };
      const dotSizeClasses = { sm: 'w-2.5 h-2.5 border-2', md: 'w-3 h-3 border-2', lg: 'w-4 h-4 border-[3px]' };
      const initials = (profile?.displayName || 'U').split(' ').map((n) => n[0]).join('').slice(0, 2).toUpperCase();
      const statusKey = profile?.status || 'online';
      const dotClass = STATUS_CONFIG[statusKey]?.dotColor || 'bg-[#23A55A]';

      return (
        <div className={`relative inline-flex shrink-0 rounded-full ${speaking ? 'ring-2 ring-[#23A55A]' : ''}`}>
          {profile?.avatarDataUrl ? (
            <img src={profile.avatarDataUrl} alt={profile.displayName || 'Avatar'} className={`${sizeClasses[size]} rounded-full object-cover bg-[#1E1F22]`} />
          ) : (
            <div
              className={`${sizeClasses[size]} ${profile?.avatarColor || ''} rounded-full flex items-center justify-center font-bold text-white`}
              style={{ backgroundColor: !profile?.avatarColor ? accentHex : undefined }}
            >
              {initials}
            </div>
          )}
          {showStatus && <span className={`absolute bottom-0 right-0 ${dotSizeClasses[size]} ${dotClass} rounded-full border-[#232428]`} />}
        </div>
      );
    }

    function RemotePeerCard({ peerData, stream, isDeafened, accentHex }) {
      const videoRef = useRef(null);
      const audioRef = useRef(null);
      const [hasActiveVideo, setHasActiveVideo] = useState(false);

      useEffect(() => {
        if (!stream) { setHasActiveVideo(false); return; }
        if (videoRef.current) videoRef.current.srcObject = stream;
        if (audioRef.current) {
          audioRef.current.srcObject = stream;
          audioRef.current.muted = isDeafened;
          audioRef.current.play().catch(() => {});
        }
        const checkVideoTracks = () => {
          const vTracks = stream.getVideoTracks();
          setHasActiveVideo(vTracks.some((t) => t.enabled && t.readyState === 'live' && !t.muted));
        };
        checkVideoTracks();
        const interval = setInterval(checkVideoTracks, 500);
        return () => clearInterval(interval);
      }, [stream, isDeafened]);

      return (
        <div className="relative aspect-video bg-[#1E1F22] border border-[#3F4147] rounded-lg overflow-hidden flex flex-col items-center justify-center shadow-lg">
          <audio ref={audioRef} autoPlay playsInline />
          <video ref={videoRef} autoPlay muted playsInline className={`w-full h-full object-contain bg-black ${hasActiveVideo ? 'block' : 'hidden'}`} />
          {!hasActiveVideo && (
            <div className="flex flex-col items-center justify-center p-4">
              <UserAvatar profile={peerData} size="lg" accentHex={accentHex} />

              {peerData?.displayName || 'Usuário'}

            )}
          </div>
        </div>
      );
    }

        });
        return () => unsub();
      }, []);

      // Sincronizar Perfil do Usuário

        const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid);
        const unsubProf = onSnapshot(userRef, async (snap) => {

            setEditBio(data.bio || '');

              friends: [],

            await setDoc(userRef, initProf);
            setUserProfile(initProf);
          }
        });
        return () => unsubProf();
      }, [user]);

      // Coleções Globais
      useEffect(() => {
        if (!user) return;
        const unsubUsers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (s) =>
          setAllUsers(s.docs.map((d) => ({ id: d.id, ...d.data() })))

        const unsubSrvs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'servers'), (s) => {

        );
        return () => { unsubUsers(); unsubReqs(); unsubSrvs(); unsubChs(); };

        return () => unsubMsgs();

      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages.length, currentRoomId]);

      const refreshMediaDevices = async () => {
        try {
          if (!navigator.mediaDevices?.enumerateDevices) return;
          const devices = await navigator.mediaDevices.enumerateDevices();
          const mics = devices.filter((d) => d.kind === 'audioinput');
          const cams = devices.filter((d) => d.kind === 'videoinput');
          setAudioDevices(mics);
          setVideoDevices(cams);
          if (!selectedAudioId && mics.length > 0) {
            const realMic = mics.find((m) => !m.label.toLowerCase().includes('virtual')) || mics[0];

            const realCam = cams.find((c) => !c.label.toLowerCase().includes('obs') && !c.label.toLowerCase().includes('virtual')) || cams[0];
            setSelectedVideoId(realCam.deviceId);
          }
        } catch (e) {}
      };

      useEffect(() => { refreshMediaDevices(); }, []);

      const stopLocalMediaAndPeers = async () => {
        if (analyserTimerRef.current) { clearInterval(analyserTimerRef.current); analyserTimerRef.current = null; }
        if (audioContextRef.current) { try { await audioContextRef.current.close(); } catch (e) {} audioContextRef.current = null; }
        if (localAudioStreamRef.current) { localAudioStreamRef.current.getTracks().forEach((t) => t.stop()); localAudioStreamRef.current = null; }
        if (localVideoStreamRef.current) { localVideoStreamRef.current.getTracks().forEach((t) => t.stop()); localVideoStreamRef.current = null; }
        if (localVideoRef.current) localVideoRef.current.srcObject = null;
        Object.values(peerConnectionsRef.current).forEach((pc) => { try { pc.close(); } catch (e) {} });
        peerConnectionsRef.current = {};
        audioTransceiversRef.current = {};
        videoTransceiversRef.current = {};
        pendingCandidatesRef.current = {};
        setRemotePeers({});
        setMicLevel(0);
        setIsCamEnabled(false);
        setIsScreenSharing(false);
      };

      const initVoiceActivityDetection = (stream) => {
        try {
          if (analyserTimerRef.current) clearInterval(analyserTimerRef.current);
          if (audioContextRef.current) audioContextRef.current.close().catch(() => {});
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          if (ctx.state === 'suspended') ctx.resume();
          audioContextRef.current = ctx;
          const source = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          source.connect(analyser);
          const buffer = new Uint8Array(analyser.frequencyBinCount);
          analyserTimerRef.current = setInterval(() => {
            if (!localAudioStreamRef.current) return;
            const track = localAudioStreamRef.current.getAudioTracks()[0];
            if (!track || !track.enabled || track.readyState !== 'live') { setMicLevel(0); return; }
            analyser.getByteFrequencyData(buffer);
            const avg = buffer.reduce((acc, v) => acc + v, 0) / buffer.length;
            setMicLevel(Math.min(100, Math.round(avg * 2.2)));
          }, 100);
        } catch (e) {}
      };

      const replaceAudioTrackOnAllPeers = async (audioTrack) => {
        for (const transceiver of Object.values(audioTransceiversRef.current)) {
          if (transceiver?.sender) { try { await transceiver.sender.replaceTrack(audioTrack || null); } catch (e) {} }
        }
      };

      const replaceVideoTrackOnAllPeers = async (videoTrack) => {
        for (const transceiver of Object.values(videoTransceiversRef.current)) {
          if (transceiver?.sender) { try { await transceiver.sender.replaceTrack(videoTrack || null); } catch (e) {} }
        }
      };

      const joinCallRoom = async (roomId, title, withCamera = false) => {
        if (!user || !userProfile || activeCallRoomId === roomId) return;
        await stopLocalMediaAndPeers();
        setMediaError(null);
        setActiveCallRoomId(roomId);
        setActiveCallTitle(title);

        try {
          const audioConstraints = selectedAudioId
            ? { deviceId: { ideal: selectedAudioId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            : { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
          const aStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
          localAudioStreamRef.current = aStream;
          setIsMicMuted(false);
          initVoiceActivityDetection(aStream);
          refreshMediaDevices();
        } catch (err) {
          setMediaError('Microfone bloqueado pelo navegador. Verifique as permissões de áudio.');
        }

        if (withCamera) {
          try {
            const videoConstraints = selectedVideoId
              ? { deviceId: { ideal: selectedVideoId }, width: { ideal: 1280 }, height: { ideal: 720 } }
              : { width: { ideal: 1280 }, height: { ideal: 720 } };
            const vStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
            localVideoStreamRef.current = vStream;
            setIsCamEnabled(true);
            if (localVideoRef.current) localVideoRef.current.srcObject = vStream;
          } catch (err) {
            showToast('Não foi possível abrir a câmera.', true);
          }
        }

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'call_peers', `${roomId}_${user.uid}`), {
          roomId,
          uid: user.uid,
          displayName: userProfile.displayName,
          avatarDataUrl: userProfile.avatarDataUrl || '',
          avatarColor: userProfile.avatarColor || AVATAR_COLORS[0],
          isScreenSharing: false,
          joinedAt: Date.now()
        });
        showToast(`Conectado à chamada: ${title}`);
      };

      const leaveCallRoom = async () => {
        const prevRoom = activeCallRoomId;
        setActiveCallRoomId(null);
        setActiveCallTitle('');
        await stopLocalMediaAndPeers();
        if (user && prevRoom) {
          try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'call_peers', `${prevRoom}_${user.uid}`)); } catch (e) {}
        }
        showToast('Desconectado da chamada');
      };

      useEffect(() => {
        if (!user || !activeCallRoomId) return;

        const getOrCreatePeerConnection = (remoteUid, remoteProfile) => {
          if (peerConnectionsRef.current[remoteUid]) return peerConnectionsRef.current[remoteUid];
          const pc = new RTCPeerConnection(RTC_CONFIG);
          peerConnectionsRef.current[remoteUid] = pc;
          pendingCandidatesRef.current[remoteUid] = [];

          const audioTransceiver = pc.addTransceiver('audio', { direction: 'sendrecv' });
          const videoTransceiver = pc.addTransceiver('video', { direction: 'sendrecv' });
          audioTransceiversRef.current[remoteUid] = audioTransceiver;
          videoTransceiversRef.current[remoteUid] = videoTransceiver;

          const currentAudioTrack = localAudioStreamRef.current?.getAudioTracks()[0] || null;
          if (currentAudioTrack) audioTransceiver.sender.replaceTrack(currentAudioTrack).catch(() => {});
          const currentVideoTrack = localVideoStreamRef.current?.getVideoTracks()[0] || null;
          if (currentVideoTrack) videoTransceiver.sender.replaceTrack(currentVideoTrack).catch(() => {});

          const remoteMediaStream = new MediaStream();
          setRemotePeers((prev) => ({ ...prev, [remoteUid]: { profile: remoteProfile, stream: remoteMediaStream } }));

          pc.ontrack = (event) => {
            if (event.track) {
              if (!remoteMediaStream.getTracks().find((t) => t.id === event.track.id)) remoteMediaStream.addTrack(event.track);
              setRemotePeers((prev) => ({ ...prev, [remoteUid]: { profile: prev[remoteUid]?.profile || remoteProfile, stream: remoteMediaStream } }));
            }
          };

          pc.onicecandidate = async (event) => {
            if (event.candidate) {
              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rtc_signals'), {
                roomId: activeCallRoomId, from: user.uid, to: remoteUid, type: 'candidate', candidate: event.candidate.toJSON(), createdAt: Date.now()
              });
            }
          };

          return pc;
        };

        const unsubPeers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'call_peers'), async (snap) => {
          const others = snap.docs.map((d) => d.data()).filter((p) => p.roomId === activeCallRoomId && p.uid !== user.uid);
          const activeUids = new Set(others.map((o) => o.uid));

          setRemotePeers((prev) => {
            const next = { ...prev };
            Object.keys(next).forEach((uid) => {
              if (!activeUids.has(uid)) {
                if (peerConnectionsRef.current[uid]) { peerConnectionsRef.current[uid].close(); delete peerConnectionsRef.current[uid]; }
                delete next[uid];
              }
            });
            return next;
          });

          for (const other of others) {
            if (!peerConnectionsRef.current[other.uid]) {
              const pc = getOrCreatePeerConnection(other.uid, other);
              if (user.uid < other.uid) {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rtc_signals'), {
                  roomId: activeCallRoomId, from: user.uid, to: other.uid, type: 'offer', sdp: { type: offer.type, sdp: offer.sdp }, createdAt: Date.now()
                });
              }
            }
          }
        });

        const seenSignals = new Set();
        const unsubSignals = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'rtc_signals'), async (snap) => {
          for (const change of snap.docChanges()) {
            if (change.type !== 'added' || seenSignals.has(change.doc.id)) continue;
            seenSignals.add(change.doc.id);
            const sig = change.doc.data();
            if (sig.roomId !== activeCallRoomId || sig.to !== user.uid) continue;

            const senderProf = allUsers.find((u) => u.uid === sig.from) || { displayName: 'Usuário' };
            const pc = getOrCreatePeerConnection(sig.from, senderProf);

            try {
              if (sig.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
                for (const c of (pendingCandidatesRef.current[sig.from] || [])) await pc.addIceCandidate(new RTCIceCandidate(c));
                pendingCandidatesRef.current[sig.from] = [];
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rtc_signals'), {
                  roomId: activeCallRoomId, from: user.uid, to: sig.from, type: 'answer', sdp: { type: answer.type, sdp: answer.sdp }, createdAt: Date.now()
                });
              } else if (sig.type === 'answer' && pc.signalingState === 'have-local-offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
                for (const c of (pendingCandidatesRef.current[sig.from] || [])) await pc.addIceCandidate(new RTCIceCandidate(c));
                pendingCandidatesRef.current[sig.from] = [];
              } else if (sig.type === 'candidate' && sig.candidate) {
                if (pc.remoteDescription && pc.remoteDescription.type) await pc.addIceCandidate(new RTCIceCandidate(sig.candidate));
                else pendingCandidatesRef.current[sig.from] = [...(pendingCandidatesRef.current[sig.from] || []), sig.candidate];
              }
            } catch (e) {}
          }
        });

        return () => { unsubPeers(); unsubSignals(); };
      }, [user, activeCallRoomId, allUsers]);

      const handleToggleMic = async () => {
        if (!localAudioStreamRef.current) return;
        const nextMuted = !isMicMuted;
        localAudioStreamRef.current.getAudioTracks().forEach((t) => { t.enabled = !nextMuted; });
        setIsMicMuted(nextMuted);
      };

      const handleToggleCamera = async () => {
        if (!activeCallRoomId) return;
        if (isCamEnabled) {
          if (localVideoStreamRef.current) { localVideoStreamRef.current.getTracks().forEach((t) => t.stop()); localVideoStreamRef.current = null; }
          if (localVideoRef.current) localVideoRef.current.srcObject = null;
          await replaceVideoTrackOnAllPeers(null);
          setIsCamEnabled(false);
        } else {
          try {
            const camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            localVideoStreamRef.current = camStream;
            if (localVideoRef.current) localVideoRef.current.srcObject = camStream;
            await replaceVideoTrackOnAllPeers(camStream.getVideoTracks()[0]);
            setIsCamEnabled(true);
            setIsScreenSharing(false);
          } catch (e) {
            showToast('Erro ao ligar câmera.', true);
          }
        }
      };

      const handleToggleScreenShare = async () => {
        if (!activeCallRoomId) return;
        if (isScreenSharing) {
          if (localVideoStreamRef.current) { localVideoStreamRef.current.getTracks().forEach((t) => t.stop()); localVideoStreamRef.current = null; }
          if (localVideoRef.current) localVideoRef.current.srcObject = null;
          await replaceVideoTrackOnAllPeers(null);
          setIsScreenSharing(false);
          return;
        }
        try {
          const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          const screenTrack = screenStream.getVideoTracks()[0];
          localVideoStreamRef.current = screenStream;
          if (localVideoRef.current) localVideoRef.current.srcObject = screenStream;
          await replaceVideoTrackOnAllPeers(screenTrack);
          screenTrack.onended = async () => {
            setIsScreenSharing(false);
            if (localVideoRef.current) localVideoRef.current.srcObject = null;
            await replaceVideoTrackOnAllPeers(null);
          };
          setIsScreenSharing(true);
          setIsCamEnabled(false);
          showToast('Transmitindo tela ao vivo!');
        } catch (err) {
          showToast('Permissão de tela negada ou não suportada.', true);
        }
      };

      const friendsList = useMemo(() => (userProfile?.friends ? allUsers.filter((u) => userProfile.friends.includes(u.uid)) : []), [allUsers, userProfile]);
      const onlineFriendsList = useMemo(() => friendsList.filter((f) => (f.status || 'online') !== 'offline'), [friendsList]);
      const incomingRequests = useMemo(() => (user ? friendRequests.filter((r) => r.toUid === user.uid && r.status === 'pending') : []), [friendRequests, user]);
      const activeFriend = useMemo(() => allUsers.find((u) => u.uid === activeFriendUid) || null, [allUsers, activeFriendUid]);
      const activeServer = useMemo(() => servers.find((s) => s.id === activeServerId) || null, [servers, activeServerId]);
      const activeServerChannels = useMemo(() => channels.filter((c) => c.serverId === activeServerId), [channels, activeServerId]);
      const activeChannel = useMemo(() => activeServerChannels.find((c) => c.id === activeChannelId) || null, [activeServerChannels, activeChannelId]);
      const activeServerMembers = useMemo(() => (activeServer?.members ? allUsers.filter((u) => activeServer.members.includes(u.uid)) : []), [allUsers, activeServer]);

      const handleAvatarUploadFromPC = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadingAvatar(true);
        try {
          const compressed = await compressImageFromPC(file, 256, 0.85);
          setEditAvatarDataUrl(compressed);
          showToast('Foto carregada!');
        } catch (err) {
          showToast(err.message, true);
        } finally {
          setUploadingAvatar(false);
        }
      };

      const handleChatImageUploadFromPC = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressed = await compressImageFromPC(file, 800, 0.8);
          setAttachedImageDataUrl(compressed);
        } catch (err) {
          showToast(err.message, true);
        }
      };

      const handleSaveProfile = async (e) => {
        if (e) e.preventDefault();
        if (!user || !userProfile || !editDisplayName.trim()) return;
        const cleanUser = editUsername.trim().toLowerCase().replace(/[^a-z0-9_]/g, '') || userProfile.username;
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), {
          displayName: editDisplayName.trim(),
          username: cleanUser,
          fullHandle: `${cleanUser}#${userProfile.tag}`,
          bio: editBio.trim(),
          avatarDataUrl: editAvatarDataUrl,
          avatarColor: editAvatarColor,
          bannerColor: editBannerColor,
          theme: currentThemeKey,
          accentHex: currentAccentHex
        });
        setShowSettingsModal(false);
        showToast('Perfil e tema salvos!');
      };

      const handleSendFriendRequest = async (e) => {
        e.preventDefault();
        if (!user || !userProfile || !friendQuery.trim()) return;
        const search = friendQuery.trim().replace(/^@/, '').toLowerCase();
        const target = allUsers.find((u) => u.fullHandle?.toLowerCase() === search || u.uid.toLowerCase() === search);
        if (!target) { setFriendFeedback({ isError: true, text: 'Usuário não encontrado.' }); return; }
        if (target.uid === user.uid) { setFriendFeedback({ isError: true, text: 'Você não pode adicionar a si mesmo.' }); return; }
        if (userProfile.friends?.includes(target.uid)) { setFriendFeedback({ isError: true, text: 'Vocês já são amigos!' }); return; }

        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'friend_requests'), {
          fromUid: user.uid, fromName: userProfile.displayName, fromHandle: userProfile.fullHandle,
          toUid: target.uid, toName: target.displayName, toHandle: target.fullHandle, status: 'pending', createdAt: Date.now()
        });
        setFriendQuery('');
        setFriendFeedback({ isError: false, text: `Pedido enviado para ${target.fullHandle}!` });
      };

      const handleAcceptRequest = async (req) => {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'friend_requests', req.id), { status: 'accepted' });
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), { friends: arrayUnion(req.fromUid) });
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', req.fromUid), { friends: arrayUnion(user.uid) });
        showToast(`Pedido de ${req.fromName} aceito!`);
      };

      const handleDeclineRequest = async (reqId) => {
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'friend_requests', reqId));
      };

      const handleCreateServer = async (e) => {
        e.preventDefault();
        if (!user || !newServerName.trim()) return;
        const inviteCode = generateInviteCode();
        const srvRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'servers'), {
          name: newServerName.trim(), ownerId: user.uid, inviteCode, members: [user.uid], createdAt: Date.now()
        });
        const textChRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'channels'), {
          serverId: srvRef.id, name: 'geral', type: 'text', createdAt: Date.now()
        });
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'channels'), {
          serverId: srvRef.id, name: 'Geral', type: 'voice', createdAt: Date.now() + 1
        });
        setActiveServerId(srvRef.id);
        setActiveChannelId(textChRef.id);
        setViewMode('server');
        setNewServerName('');
        setShowServerModal(false);
        showToast(`Servidor criado! Convite: ${inviteCode}`);
      };

      const handleJoinServer = async (e) => {
        e.preventDefault();
        if (!user || !joinInviteCode.trim()) return;
        const cleanCode = joinInviteCode.trim().toUpperCase();
        const unsubOnce = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'servers'), async (snap) => {
          unsubOnce();
          const targetSrv = snap.docs.find((d) => d.data().inviteCode?.toUpperCase() === cleanCode);
          if (!targetSrv) { showToast('Código inválido.', true); return; }
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'servers', targetSrv.id), { members: arrayUnion(user.uid) });
          const firstCh = channels.find((c) => c.serverId === targetSrv.id);
          setActiveServerId(targetSrv.id);
          if (firstCh) setActiveChannelId(firstCh.id);
          setViewMode('server');
          setJoinInviteCode('');
          setShowServerModal(false);
          showToast(`Entrou em ${targetSrv.data().name}!`);
        });
      };

      const handleCreateChannel = async (e) => {
        e.preventDefault();
        if (!user || !activeServerId || !newChannelName.trim()) return;
        const formatted = newChannelType === 'text' ? newChannelName.trim().toLowerCase().replace(/\s+/g, '-') : newChannelName.trim();
        const chRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'channels'), {
          serverId: activeServerId, name: formatted, type: newChannelType, createdAt: Date.now()
        });
        setActiveChannelId(chRef.id);
        if (newChannelType === 'voice') joinCallRoom(`ch_${chRef.id}`, formatted, false);
        setNewChannelName('');
        setShowChannelModal(false);
      };

      const handleSendMessage = async (e, customImageUrl = null) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!user || !userProfile || !currentRoomId) return;
        const text = messageInput.trim();
        const imgData = customImageUrl || attachedImageDataUrl;
        if (!text && !imgData) return;

        setMessageInput('');
        setAttachedImageDataUrl('');
        setShowGifPicker(false);

        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
          roomId: currentRoomId, senderId: user.uid, text, imageDataUrl: imgData,
          reactions: {}, edited: false, clientTimestamp: Date.now(), createdAt: serverTimestamp()
        });
      };

      const copyToClipboard = (text, label) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(label || `Copiado: ${text}`);
      };

      if (authLoading || !userProfile) {
        return (
          <div className="h-screen w-screen bg-[#313338] flex flex-col items-center justify-center text-white">
            <div className="w-16 h-16 rounded-2xl bg-[#5865F2] flex items-center justify-center shadow-lg animate-pulse mb-4">
              <LucideIcon name="DoorOpen" className="w-9 h-9 text-white" />
            </div>
            <div className="text-sm font-bold tracking-wider uppercase text-[#B5BAC1]">Carregando Doors.cord...</div>
          </div>
        );
      }

      const remotePeerEntries = Object.entries(remotePeers);

      return (
        <div className="h-screen w-screen overflow-hidden flex font-sans antialiased select-none transition-colors duration-300" style={{ backgroundColor: activeTheme.bgMain, color: activeTheme.textNormal }}>
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-md shadow-xl text-xs font-semibold text-white flex items-center gap-2 ${toast.isError ? 'bg-[#F23F43]' : 'bg-[#23A55A]'}`}>
              <LucideIcon name={toast.isError ? "AlertCircle" : "Check"} className="w-4 h-4" />
              <span>{toast.msg}</span>
            </div>
          )}

          {/* 1. BARRA LATERAL DE SERVIDORES */}
          <nav className="w-[72px] flex flex-col items-center py-3 gap-2 shrink-0 z-30" style={{ backgroundColor: activeTheme.bgServer }}>
            <div className="relative group flex items-center justify-center w-full">
              <span className={`absolute left-0 w-1 rounded-r-full transition-all duration-200 ${viewMode === 'home' ? 'h-10' : 'h-0 group-hover:h-5'}`} style={{ backgroundColor: currentAccentHex }} />
              <button
                onClick={() => { setViewMode('home'); if (homeTab === 'dm' && !activeFriendUid) setHomeTab('online'); }}
                title="Mensagens Diretas — Doors.cord"
                className={`w-12 h-12 flex items-center justify-center transition-all duration-200 ${viewMode === 'home' ? 'rounded-2xl text-white shadow-md' : 'rounded-3xl bg-[#313338] text-[#DBDEE1] hover:rounded-2xl hover:text-white'}`}
                style={{ backgroundColor: viewMode === 'home' ? currentAccentHex : undefined }}
              >
                <LucideIcon name="DoorOpen" className="w-6 h-6" />
              </button>
              {incomingRequests.length > 0 && (
                <span className="absolute bottom-0 right-3 w-4 h-4 rounded-full bg-[#F23F43] border-2 border-[#1E1F22] text-[10px] font-bold text-white flex items-center justify-center">
                  {incomingRequests.length}
                </span>
              )}
            </div>

            <div className="w-8 h-[2px] bg-[#35363C] rounded-full my-0.5" />

            <div className="flex-1 w-full overflow-y-auto flex flex-col items-center gap-2 no-scrollbar">
              {servers.map((srv) => {
                const isSelected = viewMode === 'server' && activeServerId === srv.id;
                const initials = srv.name.split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
                return (
                  <div key={srv.id} className="relative group flex items-center justify-center w-full">
                    <span className={`absolute left-0 w-1 rounded-r-full transition-all duration-200 ${isSelected ? 'h-10' : 'h-0 group-hover:h-5'}`} style={{ backgroundColor: currentAccentHex }} />
                    <button
                      onClick={() => { setActiveServerId(srv.id); setViewMode('server'); const firstCh = channels.find((c) => c.serverId === srv.id); if (firstCh) setActiveChannelId(firstCh.id); }}
                      title={srv.name}
                      className={`w-12 h-12 flex items-center justify-center font-bold text-sm transition-all duration-200 ${isSelected ? 'rounded-2xl text-white shadow-md' : 'rounded-3xl bg-[#313338] text-[#DBDEE1] hover:rounded-2xl hover:text-white'}`}
                      style={{ backgroundColor: isSelected ? currentAccentHex : undefined }}
                    >
                      {initials}
                    </button>
                  </div>
                );
              })}

              <button onClick={() => setShowServerModal(true)} title="Adicionar servidor" className="w-12 h-12 rounded-3xl hover:rounded-2xl bg-[#313338] hover:bg-[#23A55A] text-[#23A55A] hover:text-white flex items-center justify-center transition-all">
                <LucideIcon name="Plus" className="w-6 h-6" />
              </button>

                      </div>
                      <input type="text" value={editDisplayName} onChange={(e) => setEditDisplayName(e.target.value)} className="w-full bg-[#1E1F22] rounded px-3 py-2 text-sm text-white outline-none" />
                      <button type="submit" className="px-5 py-2 rounded text-white text-xs font-medium" style={{ backgroundColor: currentAccentHex }}>Salvar</button>
                    </form>
                  )}

                  {settingsTab === 'appearance' && (
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-white">Temas Grátis</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {Object.values(THEMES).map((t) => (
                          <button key={t.id} onClick={() => setCurrentThemeKey(t.id)} className={`p-3 rounded border text-left text-sm font-semibold ${currentThemeKey === t.id ? 'border-white bg-[#404249]/40' : 'border-[#3F4147] bg-[#2B2D31]'}`}>
                            {t.name}
                          </button>
                        ))}
                      </div>
                      <div className="flex gap-2">
                        {ACCENT_COLORS.map((ac) => (
                          <button key={ac.id} onClick={() => setCurrentAccentHex(ac.hex)} className="w-8 h-8 rounded-full" style={{ backgroundColor: ac.hex }} />
                        ))}
                      </div>
                      <button onClick={handleSaveProfile} className="px-5 py-2 rounded text-white text-xs font-medium" style={{ backgroundColor: currentAccentHex }}>Aplicar Tema</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL SERVIDOR */}
          {showServerModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-[#313338] w-full max-w-md rounded-lg p-6">
                <div className="flex justify-between mb-4">
                  <h3 className="text-lg font-bold text-white">Servidor</h3>
                  <button onClick={() => setShowServerModal(false)}><LucideIcon name="X" className="w-5 h-5" /></button>
                </div>
                <div className="flex gap-2 mb-4 bg-[#1E1F22] p-1 rounded">
                  <button onClick={() => setServerModalTab('create')} className="flex-1 py-1.5 rounded text-xs font-semibold text-white" style={{ backgroundColor: serverModalTab === 'create' ? currentAccentHex : undefined }}>Criar</button>
                  <button onClick={() => setServerModalTab('join')} className="flex-1 py-1.5 rounded text-xs font-semibold text-white" style={{ backgroundColor: serverModalTab === 'join' ? currentAccentHex : undefined }}>Convidar</button>
                </div>
                {serverModalTab === 'create' ? (
                  <form onSubmit={handleCreateServer} className="space-y-4">
                    <input type="text" required value={newServerName} onChange={(e) => setNewServerName(e.target.value)} placeholder="Nome do Servidor" className="w-full bg-[#1E1F22] rounded px-3 py-2.5 text-sm text-white outline-none" />
                    <button type="submit" className="w-full py-2.5 rounded text-white text-sm font-medium" style={{ backgroundColor: currentAccentHex }}>Criar</button>
                  </form>
                ) : (
                  <form onSubmit={handleJoinServer} className="space-y-4">
                    <input type="text" required value={joinInviteCode} onChange={(e) => setJoinInviteCode(e.target.value)} placeholder="Código DC-XXXXXX" className="w-full bg-[#1E1F22] rounded px-3 py-2.5 text-sm text-white font-mono uppercase outline-none" />
                    <button type="submit" className="w-full py-2.5 rounded text-white text-sm font-medium" style={{ backgroundColor: currentAccentHex }}>Entrar</button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* MODAL CANAL */}
          {showChannelModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-[#313338] w-full max-w-md rounded-lg p-6">
                <h3 className="text-lg font-bold text-white mb-4">Criar Canal</h3>
                <form onSubmit={handleCreateChannel} className="space-y-4">
                  <input type="text" required value={newChannelName} onChange={(e) => setNewChannelName(e.target.value)} placeholder="nome-do-canal" className="w-full bg-[#1E1F22] rounded px-3 py-2.5 text-sm text-white outline-none" />
                  <button type="submit" className="w-full py-2.5 rounded text-white text-sm font-medium" style={{ backgroundColor: currentAccentHex }}>Criar</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Bootstrap após o módulo ES do Firebase carregar
    function startDoorsCord() {
      const sdk = window.FirebaseSDK;
      if (!sdk) return;

      const firebaseConfig = typeof __firebase_config !== 'undefined'
        ? JSON.parse(__firebase_config)
        : {
            apiKey: "demo-key",
            authDomain: "demo.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
          };

      const app = sdk.initializeApp(firebaseConfig);
      const auth = sdk.getAuth(app);
      const db = sdk.getFirestore(app);
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'doorscord-realtime-br-v2';

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App fb={{ ...sdk, auth, db, appId }} />);
    }

    if (window.FirebaseSDK) {
      startDoorsCord();
    } else {
      window.addEventListener('firebase-ready', startDoorsCord);
    }
  </script>
</body>
</html>
