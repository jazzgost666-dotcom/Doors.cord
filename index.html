    function LucideIcon({ name, className = "w-5 h-5" }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (!containerRef.current || !window.lucide) return;
        const iconDef = window.lucide.icons[name];
        if (!iconDef) return;
        const svgElement = window.lucide.createElement(iconDef);
        svgElement.setAttribute("class", className);
        containerRef.current.innerHTML = "";
        containerRef.current.appendChild(svgElement);
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" />;
    }

    const CURATED_GIFS = [

      { id: 'g2', title: 'Opa Olá Aceno', url: 'https://media.giphy.com/media/3o7abB06u9bNzA8lu8/giphy.gif' },

    function generateTag(uid = '') {
      let hash = 0;
      for (let i = 0; i < uid.length; i++) hash = (hash * 31 + uid.charCodeAt(i)) % 9000;
      return String(1000 + Math.abs(hash)).slice(0, 4);
    }

    function generateInviteCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = 'DC-';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function getDmRoomId(uidA, uidB) {
      return [uidA, uidB].sort().join('_');
    }

    function formatTimestamp(ts) {
      if (!ts) return 'Agora';
      const date = ts?.toDate ? ts.toDate() : new Date(ts);
      if (isNaN(date.getTime())) return 'Agora';
      return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function compressImageFromPC(file, maxSize = 256, quality = 0.85) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith('image/')) {
          reject(new Error('Selecione apenas imagens.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > h) { if (w > maxSize) { h = Math.round((h * maxSize) / w); w = maxSize; } }
            else { if (h > maxSize) { w = Math.round((w * maxSize) / h); h = maxSize; } }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('Erro ao processar imagem.'));
          img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error('Erro ao ler arquivo.'));
        reader.readAsDataURL(file);
      });
    }

    function UserAvatar({ profile, size = 'md', showStatus = false, accentHex = '#5865F2', speaking = false }) {
      const sizeClasses = { sm: 'w-8 h-8 text-xs', md: 'w-10 h-10 text-sm', lg: 'w-16 h-16 text-xl' };
      const dotSizeClasses = { sm: 'w-2.5 h-2.5 border-2', md: 'w-3 h-3 border-2', lg: 'w-4 h-4 border-[3px]' };
      const initials = (profile?.displayName || 'U').split(' ').map((n) => n[0]).join('').slice(0, 2).toUpperCase();
      const statusKey = profile?.status || 'online';
      const dotClass = STATUS_CONFIG[statusKey]?.dotColor || 'bg-[#23A55A]';

      return (
        <div className={`relative inline-flex shrink-0 rounded-full ${speaking ? 'ring-2 ring-[#23A55A]' : ''}`}>
          {profile?.avatarDataUrl ? (
            <img src={profile.avatarDataUrl} alt={profile.displayName || 'Avatar'} className={`${sizeClasses[size]} rounded-full object-cover bg-[#1E1F22]`} />
          ) : (
            <div className={`${sizeClasses[size]} rounded-full flex items-center justify-center font-bold text-white`} style={{ backgroundColor: profile?.avatarColor || accentHex }}>
              {initials}
            </div>
          )}
          {showStatus && <span className={`absolute bottom-0 right-0 ${dotSizeClasses[size]} ${dotClass} rounded-full border-[#232428]`} />}
        </div>
      );
    }

    function RemotePeerCard({ peerData, stream, isDeafened, accentHex }) {
      const videoRef = useRef(null);
      const audioRef = useRef(null);
      const [hasActiveVideo, setHasActiveVideo] = useState(false);

      useEffect(() => {
        if (!stream) { setHasActiveVideo(false); return; }
        if (videoRef.current) videoRef.current.srcObject = stream;
        if (audioRef.current) {
          audioRef.current.srcObject = stream;
          audioRef.current.muted = isDeafened;
          audioRef.current.play().catch(() => {});
        }
        const checkVideo = () => {
          const vTracks = stream.getVideoTracks();
          setHasActiveVideo(vTracks.some((t) => t.enabled && t.readyState === 'live' && !t.muted));
        };
        checkVideo();
        const interval = setInterval(checkVideo, 500);
        return () => clearInterval(interval);
      }, [stream, isDeafened]);

      return (
        <div className="relative aspect-video bg-[#1E1F22] border border-[#3F4147] rounded-lg overflow-hidden flex flex-col items-center justify-center shadow-lg">
          <audio ref={audioRef} autoPlay playsInline />
          <video ref={videoRef} autoPlay muted playsInline className={`w-full h-full object-contain bg-black ${hasActiveVideo ? 'block' : 'hidden'}`} />
          {!hasActiveVideo && (
            <div className="flex flex-col items-center justify-center p-4">
              <UserAvatar profile={peerData} size="lg" accentHex={accentHex} />
              <span className="mt-2.5 text-xs text-[#23A55A] flex items-center gap-1.5 font-medium">
                <LucideIcon name="Radio" className="w-3.5 h-3.5 animate-pulse" /> Voz HD Ativa
              </span>
            </div>
          )}
          <div className="absolute bottom-2.5 left-2.5 right-2.5 flex items-center justify-between pointer-events-none">
            <span className="bg-[#111214]/85 px-2.5 py-1 rounded text-xs font-semibold text-white">{peerData?.displayName || 'Usuário'}</span>
            {peerData?.isScreenSharing && (
              <span className="bg-[#F23F43] text-white px-2 py-0.5 rounded text-[10px] font-bold uppercase">Ao Vivo (Tela)</span>
            )}
          </div>
        </div>
      );
    }

    function App({ fb }) {
      const {
        auth, db, appId,
        signInAnonymously, signInWithCustomToken, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged,
        collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, arrayUnion
      } = fb;

      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [userProfile, setUserProfile] = useState(null);

      const [allUsers, setAllUsers] = useState([]);
      const [friendRequests, setFriendRequests] = useState([]);
      const [servers, setServers] = useState([]);
      const [channels, setChannels] = useState([]);
      const [messages, setMessages] = useState([]);

      const [viewMode, setViewMode] = useState('home');
      const [homeTab, setHomeTab] = useState('online');
      const [activeFriendUid, setActiveFriendUid] = useState(null);
      const [activeServerId, setActiveServerId] = useState(null);
      const [activeChannelId, setActiveChannelId] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [showMembersSidebar, setShowMembersSidebar] = useState(true);

      const [currentThemeKey, setCurrentThemeKey] = useState('classic');
      const [currentAccentHex, setCurrentAccentHex] = useState('#5865F2');
      const activeTheme = THEMES[currentThemeKey] || THEMES.classic;

      const [messageInput, setMessageInput] = useState('');

      const [editingMessageId, setEditingMessageId] = useState(null);
      const [editingText, setEditingText] = useState('');
      const [reactionPickerMsgId, setReactionPickerMsgId] = useState(null);
      const [showGifPicker, setShowGifPicker] = useState(false);
      const [gifSearchQuery, setGifSearchQuery] = useState('');
      const chatFileInputRef = useRef(null);
      const chatEndRef = useRef(null);

      const [friendQuery, setFriendQuery] = useState('');
      const [friendFeedback, setFriendFeedback] = useState(null);

      const [showServerModal, setShowServerModal] = useState(false);
      const [serverModalTab, setServerModalTab] = useState('create');
      const [newServerName, setNewServerName] = useState('');
      const [joinInviteCode, setJoinInviteCode] = useState('');

      const [showChannelModal, setShowChannelModal] = useState(false);
      const [newChannelName, setNewChannelName] = useState('');
      const [newChannelType, setNewChannelType] = useState('text');

      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [settingsTab, setSettingsTab] = useState('profile');
      const [showStatusMenu, setShowStatusMenu] = useState(false);
      const [customFbJson, setCustomFbJson] = useState('');

      const [editDisplayName, setEditDisplayName] = useState('');
      const [editUsername, setEditUsername] = useState('');
      const [editBio, setEditBio] = useState('');
      const [editAvatarDataUrl, setEditAvatarDataUrl] = useState('');
      const [editAvatarColor, setEditAvatarColor] = useState(AVATAR_COLORS[0]);
      const [editBannerColor, setEditBannerColor] = useState(BANNER_COLORS[0]);
      const [uploadingAvatar, setUploadingAvatar] = useState(false);
      const avatarFileInputRef = useRef(null);

      const [activeCallRoomId, setActiveCallRoomId] = useState(null);
      const [activeCallTitle, setActiveCallTitle] = useState('');
      const [isMicMuted, setIsMicMuted] = useState(false);
      const [isDeafened, setIsDeafened] = useState(false);
      const [isCamEnabled, setIsCamEnabled] = useState(false);
      const [isScreenSharing, setIsScreenSharing] = useState(false);
      const [micLevel, setMicLevel] = useState(0);
      const [mediaError, setMediaError] = useState(null);
      const [remotePeers, setRemotePeers] = useState({});
      const [audioDevices, setAudioDevices] = useState([]);
      const [videoDevices, setVideoDevices] = useState([]);
      const [selectedAudioId, setSelectedAudioId] = useState('');
      const [selectedVideoId, setSelectedVideoId] = useState('');

      const localAudioStreamRef = useRef(null);
      const localVideoStreamRef = useRef(null);
      const localVideoRef = useRef(null);
      const peerConnectionsRef = useRef({});
      const audioTransceiversRef = useRef({});
      const videoTransceiversRef = useRef({});

      const audioContextRef = useRef(null);
      const analyserTimerRef = useRef(null);

      const [toast, setToast] = useState(null);
      const showToast = (msg, isError = false) => {
        setToast({ msg, isError });
        setTimeout(() => setToast(null), 3500);
      };

      // Autenticação robusta com fallback imediato no GitHub Pages
      useEffect(() => {
        const isDemoConfig = !fb.isConfigured;

        const createLocalFallbackUser = () => {
          const fallbackUid = 'user_' + Math.random().toString(36).slice(2, 10);
          const tag = generateTag(fallbackUid);
          const baseName = `usuario_${fallbackUid.slice(5, 9)}`;
          const fallbackProf = {
            uid: fallbackUid,
            displayName: `Usuário ${tag}`,
            username: baseName,
            tag,
            fullHandle: `${baseName}#${tag}`,
            bio: 'Online no Doors.cord',
            avatarDataUrl: '',
            avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)],
            bannerColor: BANNER_COLORS[0],
            status: 'online',
            theme: 'classic',
            accentHex: '#5865F2',
            friends: [],
            createdAt: Date.now()
          };
          setUser({ uid: fallbackUid, isFallback: true });
          setUserProfile(fallbackProf);
          setAllUsers([fallbackProf]);
          setEditDisplayName(fallbackProf.displayName);
          setEditUsername(fallbackProf.username);
          setAuthLoading(false);
        };

        if (isDemoConfig) {
          createLocalFallbackUser();
          return;
        }

        const timeoutId = setTimeout(() => {
          if (!auth.currentUser) {
            createLocalFallbackUser();
          }
        }, 3000);

        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else if (!auth.currentUser) {
              await signInAnonymously(auth);
            }
          } catch (err) {
            createLocalFallbackUser();
          }
        };
        initAuth();

        const unsub = onAuthStateChanged(auth, (curr) => {
          if (curr) {
            clearTimeout(timeoutId);
            setUser(curr);
            setAuthLoading(false);
          }
        });
        return () => {
          clearTimeout(timeoutId);
          unsub();
        };
      }, []);

      useEffect(() => {
        if (!user || user.isFallback) return;
        const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid);
        const unsubProf = onSnapshot(userRef, async (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            setUserProfile(data);
            setEditDisplayName(data.displayName || '');
            setEditUsername(data.username || '');
            setEditBio(data.bio || '');
            setEditAvatarDataUrl(data.avatarDataUrl || '');
            if (data.theme) setCurrentThemeKey(data.theme);
            if (data.accentHex) setCurrentAccentHex(data.accentHex);
          } else {
            const baseName = (user.email ? user.email.split('@')[0] : `usuario_${user.uid.slice(0, 5)}`).replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
            const tag = generateTag(user.uid);
            const initProf = {
              uid: user.uid,
              displayName: user.email ? user.email.split('@')[0] : `Usuário ${tag}`,
              username: baseName,
              tag,
              fullHandle: `${baseName}#${tag}`,
              bio: '',
              avatarDataUrl: '',
              avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)],
              bannerColor: BANNER_COLORS[0],
              status: 'online',
              theme: 'classic',
              accentHex: '#5865F2',
              friends: [],
              createdAt: Date.now()
            };
            await setDoc(userRef, initProf);
            setUserProfile(initProf);
          }
        });
        return () => unsubProf();
      }, [user]);

      useEffect(() => {
        if (!user || user.isFallback) return;
        const unsubUsers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (s) =>
          setAllUsers(s.docs.map((d) => ({ id: d.id, ...d.data() })))
        );
        const unsubReqs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'friend_requests'), (s) =>
          setFriendRequests(s.docs.map((d) => ({ id: d.id, ...d.data() })))
        );
        const unsubSrvs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'servers'), (s) => {
          const list = s.docs.map((d) => ({ id: d.id, ...d.data() })).filter((srv) => Array.isArray(srv.members) && srv.members.includes(user.uid));
          setServers(list);
        });
        const unsubChs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'channels'), (s) =>
          setChannels(s.docs.map((d) => ({ id: d.id, ...d.data() })))
        );
        return () => { unsubUsers(); unsubReqs(); unsubSrvs(); unsubChs(); };
      }, [user]);

      const currentRoomId = useMemo(() => {
        if (viewMode === 'home' && homeTab === 'dm' && user && activeFriendUid) return `dm_${getDmRoomId(user.uid, activeFriendUid)}`;
        if (viewMode === 'server' && activeChannelId) return `ch_${activeChannelId}`;
        return null;
      }, [viewMode, homeTab, user, activeFriendUid, activeChannelId]);

      useEffect(() => {
        if (!user || user.isFallback || !currentRoomId) { setMessages([]); return; }
        const unsubMsgs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), (s) => {
          const list = s.docs
            .map((d) => ({ id: d.id, ...d.data() }))
            .filter((m) => m.roomId === currentRoomId)
            .sort((a, b) => (a.clientTimestamp || 0) - (b.clientTimestamp || 0));
          setMessages(list);
        });
        return () => unsubMsgs();
      }, [user, currentRoomId]);

      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages.length, currentRoomId]);

      const refreshMediaDevices = async () => {
        try {
          if (!navigator.mediaDevices?.enumerateDevices) return;
          const devices = await navigator.mediaDevices.enumerateDevices();
          setAudioDevices(devices.filter((d) => d.kind === 'audioinput'));
          setVideoDevices(devices.filter((d) => d.kind === 'videoinput'));
        } catch (e) {}
      };

      const stopLocalMediaAndPeers = async () => {
        if (analyserTimerRef.current) { clearInterval(analyserTimerRef.current); analyserTimerRef.current = null; }
        if (audioContextRef.current) { try { await audioContextRef.current.close(); } catch (e) {} audioContextRef.current = null; }
        if (localAudioStreamRef.current) { localAudioStreamRef.current.getTracks().forEach((t) => t.stop()); localAudioStreamRef.current = null; }
        if (localVideoStreamRef.current) { localVideoStreamRef.current.getTracks().forEach((t) => t.stop()); localVideoStreamRef.current = null; }
        if (localVideoRef.current) localVideoRef.current.srcObject = null;
        Object.values(peerConnectionsRef.current).forEach((pc) => { try { pc.close(); } catch (e) {} });
        peerConnectionsRef.current = {};
        setRemotePeers({});
      };

      const joinCallRoom = async (roomId, title, withCamera = false) => {
        if (!user || !userProfile || activeCallRoomId === roomId) return;
        await stopLocalMediaAndPeers();
        setMediaError(null);
        setActiveCallRoomId(roomId);
        setActiveCallTitle(title);

        try {
          const aStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false });
          localAudioStreamRef.current = aStream;
          setIsMicMuted(false);
        } catch (err) {
          setMediaError('Microfone bloqueado ou indisponível.');
        }

        if (withCamera) {
          try {
            const vStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            localVideoStreamRef.current = vStream;
            setIsCamEnabled(true);
            if (localVideoRef.current) localVideoRef.current.srcObject = vStream;
          } catch (err) {
            showToast('Erro ao abrir câmera.', true);
          }
        }
      };

      const leaveCallRoom = async () => {
        setActiveCallRoomId(null);
        setActiveCallTitle('');
        await stopLocalMediaAndPeers();
        showToast('Desconectado da chamada');
      };

      const friendsList = useMemo(() => (userProfile?.friends ? allUsers.filter((u) => userProfile.friends.includes(u.uid)) : []), [allUsers, userProfile]);
      const onlineFriendsList = useMemo(() => friendsList.filter((f) => (f.status || 'online') !== 'offline'), [friendsList]);
      const incomingRequests = useMemo(() => (user ? friendRequests.filter((r) => r.toUid === user.uid && r.status === 'pending') : []), [friendRequests, user]);
      const activeFriend = useMemo(() => allUsers.find((u) => u.uid === activeFriendUid) || null, [allUsers, activeFriendUid]);
      const activeServer = useMemo(() => servers.find((s) => s.id === activeServerId) || null, [servers, activeServerId]);
      const activeServerChannels = useMemo(() => channels.filter((c) => c.serverId === activeServerId), [channels, activeServerId]);
      const activeChannel = useMemo(() => activeServerChannels.find((c) => c.id === activeChannelId) || null, [activeServerChannels, activeChannelId]);
      const activeServerMembers = useMemo(() => (activeServer?.members ? allUsers.filter((u) => activeServer.members.includes(u.uid)) : []), [allUsers, activeServer]);

      const handleAvatarUploadFromPC = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadingAvatar(true);
        try {
          const compressed = await compressImageFromPC(file, 256, 0.85);
          setEditAvatarDataUrl(compressed);
          showToast('Foto carregada!');
        } catch (err) {
          showToast(err.message, true);
        } finally {
          setUploadingAvatar(false);
        }
      };

      const handleSaveProfile = async (e) => {
        if (e) e.preventDefault();
        if (!user || !userProfile || !editDisplayName.trim()) return;
        const cleanUser = editUsername.trim().toLowerCase().replace(/[^a-z0-9_]/g, '') || userProfile.username;
        const updatedFields = {
          displayName: editDisplayName.trim(),
          username: cleanUser,
          fullHandle: `${cleanUser}#${userProfile.tag}`,
          bio: editBio.trim(),
          avatarDataUrl: editAvatarDataUrl,
          theme: currentThemeKey,
          accentHex: currentAccentHex
        };

        if (user.isFallback) {
          const nextProf = { ...userProfile, ...updatedFields };
          setUserProfile(nextProf);
          setAllUsers((prev) => prev.map((u) => (u.uid === user.uid ? nextProf : u)));
          setShowSettingsModal(false);
          showToast('Perfil salvo!');
          return;
        }

        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), updatedFields);
        setShowSettingsModal(false);
        showToast('Perfil salvo!');
      };

      const handleSendFriendRequest = async (e) => {
        e.preventDefault();
        if (!user || !userProfile || !friendQuery.trim()) return;
        const search = friendQuery.trim().replace(/^@/, '').toLowerCase();
        const target = allUsers.find((u) => u.fullHandle?.toLowerCase() === search || u.uid.toLowerCase() === search);
        if (!target) { setFriendFeedback({ isError: true, text: 'Usuário não encontrado.' }); return; }
        if (target.uid === user.uid) { setFriendFeedback({ isError: true, text: 'Você não pode adicionar a si mesmo.' }); return; }
        if (userProfile.friends?.includes(target.uid)) { setFriendFeedback({ isError: true, text: 'Vocês já são amigos!' }); return; }

        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'friend_requests'), {
          fromUid: user.uid, fromName: userProfile.displayName, fromHandle: userProfile.fullHandle,
          toUid: target.uid, toName: target.displayName, toHandle: target.fullHandle, status: 'pending', createdAt: Date.now()
        });
        setFriendQuery('');
        setFriendFeedback({ isError: false, text: `Pedido enviado para ${target.fullHandle}!` });
      };

      const handleAcceptRequest = async (req) => {
        if (user.isFallback) {
          showToast(`Pedido de ${req.fromName} aceito!`);
          return;
        }
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'friend_requests', req.id), { status: 'accepted' });
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), { friends: arrayUnion(req.fromUid) });
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', req.fromUid), { friends: arrayUnion(user.uid) });
      };

      const handleCreateServer = async (e) => {
        e.preventDefault();
        if (!user || !newServerName.trim()) return;
        const inviteCode = generateInviteCode();

        if (user.isFallback) {
          const srvId = 'srv_' + Date.now();
          const textChId = 'ch_' + Date.now();
          setServers((prev) => [...prev, { id: srvId, name: newServerName.trim(), ownerId: user.uid, inviteCode, members: [user.uid], createdAt: Date.now() }]);
          setChannels((prev) => [...prev, { id: textChId, serverId: srvId, name: 'geral', type: 'text', createdAt: Date.now() }]);
          setActiveServerId(srvId);
          setActiveChannelId(textChId);
          setViewMode('server');
          setNewServerName('');
          setShowServerModal(false);
          showToast(`Servidor criado! Convite: ${inviteCode}`);
          return;
        }

        const srvRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'servers'), {
          name: newServerName.trim(), ownerId: user.uid, inviteCode, members: [user.uid], createdAt: Date.now()
        });
        const textChRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'channels'), {
          serverId: srvRef.id, name: 'geral', type: 'text', createdAt: Date.now()
        });
        setActiveServerId(srvRef.id);
        setActiveChannelId(textChRef.id);
        setViewMode('server');
        setNewServerName('');
        setShowServerModal(false);
      };

      const handleSendMessage = async (e, customImageUrl = null) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!user || !userProfile || !currentRoomId) return;
        const text = messageInput.trim();
        const imgData = customImageUrl || attachedImageDataUrl;
        if (!text && !imgData) return;

        setMessageInput('');
        setAttachedImageDataUrl('');
        setShowGifPicker(false);

        if (user.isFallback) {
          setMessages((prev) => [
            ...prev,
            { id: 'msg_' + Date.now(), roomId: currentRoomId, senderId: user.uid, text, imageDataUrl: imgData, reactions: {}, clientTimestamp: Date.now() }
          ]);
          return;
        }

        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
          roomId: currentRoomId, senderId: user.uid, text, imageDataUrl: imgData, reactions: {}, clientTimestamp: Date.now(), createdAt: serverTimestamp()
        });
      };

      const copyToClipboard = (text, label) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(label || `Copiado: ${text}`);
      };

      if (authLoading || !userProfile) {
        return (
          <div className="h-screen w-screen bg-[#313338] flex flex-col items-center justify-center text-white">
            <div className="w-16 h-16 rounded-2xl bg-[#5865F2] flex items-center justify-center shadow-lg animate-pulse mb-4">
              <LucideIcon name="DoorOpen" className="w-9 h-9 text-white" />
            </div>
            <div className="text-sm font-bold tracking-wider uppercase text-[#B5BAC1]">Carregando Doors.cord...</div>
          </div>
        );
      }

      return (
        <div className="h-screen w-screen overflow-hidden flex font-sans antialiased select-none transition-colors duration-300" style={{ backgroundColor: activeTheme.bgMain, color: activeTheme.textNormal }}>
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-md shadow-xl text-xs font-semibold text-white flex items-center gap-2 ${toast.isError ? 'bg-[#F23F43]' : 'bg-[#23A55A]'}`}>
              <LucideIcon name={toast.isError ? "AlertCircle" : "Check"} className="w-4 h-4" />
              <span>{toast.msg}</span>
            </div>
          )}

          {/* BARRA DE SERVIDORES */}
          <nav className="w-[72px] flex flex-col items-center py-3 gap-2 shrink-0 z-30" style={{ backgroundColor: activeTheme.bgServer }}>
            <div className="relative group flex items-center justify-center w-full">
              <span className={`absolute left-0 w-1 rounded-r-full transition-all duration-200 ${viewMode === 'home' ? 'h-10' : 'h-0 group-hover:h-5'}`} style={{ backgroundColor: currentAccentHex }} />
              <button
                onClick={() => { setViewMode('home'); if (homeTab === 'dm' && !activeFriendUid) setHomeTab('online'); }}
                title="Mensagens Diretas"
                className={`w-12 h-12 flex items-center justify-center transition-all duration-200 ${viewMode === 'home' ? 'rounded-2xl text-white shadow-md' : 'rounded-3xl bg-[#313338] text-[#DBDEE1] hover:rounded-2xl hover:text-white'}`}
                style={{ backgroundColor: viewMode === 'home' ? currentAccentHex : undefined }}
              >
                <LucideIcon name="DoorOpen" className="w-6 h-6" />
              </button>
            </div>

            <div className="w-8 h-[2px] bg-[#35363C] rounded-full my-0.5" />

            <div className="flex-1 w-full overflow-y-auto flex flex-col items-center gap-2 no-scrollbar">

                return (
                  <div key={srv.id} className="relative group flex items-center justify-center w-full">
                    <span className={`absolute left-0 w-1 rounded-r-full transition-all duration-200 ${isSelected ? 'h-10' : 'h-0 group-hover:h-5'}`} style={{ backgroundColor: currentAccentHex }} />
                    <button
                      onClick={() => { setActiveServerId(srv.id); setViewMode('server'); const firstCh = channels.find((c) => c.serverId === srv.id); if (firstCh) setActiveChannelId(firstCh.id); }}
                      title={srv.name}
                      className={`w-12 h-12 flex items-center justify-center font-bold text-sm transition-all duration-200 ${isSelected ? 'rounded-2xl text-white shadow-md' : 'rounded-3xl bg-[#313338] text-[#DBDEE1] hover:rounded-2xl hover:text-white'}`}
                      style={{ backgroundColor: isSelected ? currentAccentHex : undefined }}
                    >
                      {initials}
                    </button>
                  </div>
                );
              })}

              <button onClick={() => setShowServerModal(true)} title="Adicionar servidor" className="w-12 h-12 rounded-3xl hover:rounded-2xl bg-[#313338] hover:bg-[#23A55A] text-[#23A55A] hover:text-white flex items-center justify-center transition-all">
                <LucideIcon name="Plus" className="w-6 h-6" />
              </button>
            </div>
          </nav>

          {/* COLUNA DE CANAIS / DMs */}
          <aside className={`${mobileMenuOpen ? 'fixed inset-y-0 left-[72px] z-40 flex' : 'hidden md:flex'} w-60 flex-col shrink-0 border-r border-black/20`} style={{ backgroundColor: activeTheme.bgSidebar }}>
            {viewMode === 'home' ? (
              <>
                <div className="h-12 px-3 border-b border-black/20 flex items-center shrink-0">
                  <button onClick={() => setHomeTab('add')} className="w-full h-7 px-2 rounded bg-[#1E1F22] text-[#949BA4] text-xs text-left flex items-center justify-between hover:text-white">
                    <span>Encontre ou comece conversa</span>
                    <LucideIcon name="Search" className="w-3.5 h-3.5" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto px-2 py-3 space-y-1">
                  <button
                    onClick={() => { setHomeTab('online'); setMobileMenuOpen(false); }}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium ${homeTab !== 'dm' ? 'bg-[#404249]/40 text-white' : 'text-[#949BA4] hover:bg-[#35373C]/50 hover:text-white'}`}
                  >
                    <LucideIcon name="Users" className="w-5 h-5" />
                    <span>Amigos</span>
                  </button>

                  <div className="pt-4 pb-1 px-2 flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-[#949BA4]">
                    <span>Mensagens Diretas</span>
                    <button onClick={() => setHomeTab('add')} className="hover:text-white"><LucideIcon name="Plus" className="w-4 h-4" /></button>
                  </div>

                  {friendsList.map((friend) => (
                    <button
                      key={friend.uid}
                      onClick={() => { setActiveFriendUid(friend.uid); setHomeTab('dm'); setMobileMenuOpen(false); }}
                      className={`w-full flex items-center gap-3 px-2 py-1.5 rounded ${homeTab === 'dm' && activeFriendUid === friend.uid ? 'bg-[#404249]/60 text-white' : 'text-[#949BA4] hover:bg-[#35373C]/40 hover:text-white'}`}
                    >
                      <UserAvatar profile={friend} size="sm" showStatus accentHex={currentAccentHex} />
                      <div className="min-w-0 flex-1 text-left">
                        <div className="text-sm font-medium truncate">{friend.displayName}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </>
            ) : (
              <>
                <div className="h-12 px-4 border-b border-black/20 flex items-center justify-between shrink-0">
                  <span className="font-bold text-white text-sm truncate">{activeServer?.name}</span>
                  <button onClick={() => copyToClipboard(activeServer?.inviteCode || '', `Convite: ${activeServer?.inviteCode}`)} className="p-1.5 rounded hover:bg-[#35373C]/40 text-[#B5BAC1] hover:text-white">
                    <LucideIcon name="UserPlus" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto px-2 py-3 space-y-4">
                  <div>
                    <div className="flex items-center justify-between px-1 mb-1 text-[11px] font-bold uppercase tracking-wider text-[#949BA4]">
                      <span>Canais de Texto</span>
                    </div>
                    {activeServerChannels.filter((c) => c.type === 'text').map((ch) => (
                      <button
                        key={ch.id}
                        onClick={() => { setActiveChannelId(ch.id); setMobileMenuOpen(false); }}
                        className={`w-full flex items-center gap-2 px-2 py-1.5 rounded text-sm font-medium ${activeChannelId === ch.id ? 'bg-[#404249]/60 text-white' : 'text-[#949BA4] hover:bg-[#35373C]/40 hover:text-white'}`}
                      >
                        <LucideIcon name="Hash" className="w-4 h-4 text-[#80848E]" />
                        <span className="truncate">{ch.name}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </>
            )}

            {/* PAINEL DO USUÁRIO INFERIOR */}
            <div className="h-[52px] bg-[#232428] px-2 flex items-center justify-between relative shrink-0">
              <button onClick={() => setShowStatusMenu(!showStatusMenu)} className="flex items-center gap-2 p-1 rounded hover:bg-[#35373C]/50 min-w-0 flex-1 text-left">
                <UserAvatar profile={userProfile} size="sm" showStatus accentHex={currentAccentHex} />
                <div className="min-w-0 flex-1">
                  <div className="text-xs font-bold text-white truncate">{userProfile.displayName}</div>
                  <div className="text-[11px] text-[#949BA4] truncate">#{userProfile.tag}</div>
                </div>
              </button>

              <div className="flex items-center">
                <button onClick={() => { setSettingsTab('profile'); setShowSettingsModal(true); }} className="p-1.5 rounded hover:bg-[#35373C]/50 text-[#B5BAC1] hover:text-white">
                  <LucideIcon name="Settings" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </aside>

          {/* ÁREA PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0" style={{ backgroundColor: activeTheme.bgChat }}>
            <header className="h-12 px-4 border-b border-black/25 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-3 min-w-0">
                <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden text-[#B5BAC1] hover:text-white">
                  <LucideIcon name="Menu" className="w-5 h-5" />
                </button>

                {viewMode === 'home' ? (
                  homeTab === 'dm' && activeFriend ? (
                    <div className="flex items-center gap-2 min-w-0">
                      <LucideIcon name="AtSign" className="w-5 h-5 text-[#80848E]" />
                      <span className="font-bold text-white text-sm truncate">{activeFriend.displayName}</span>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2 sm:gap-4 overflow-x-auto no-scrollbar">
                      <div className="flex items-center gap-2 font-bold text-white text-sm pr-2 border-r border-[#3F4147]">
                        <LucideIcon name="Users" className="w-5 h-5 text-[#80848E]" />
                        <span>Amigos</span>
                      </div>
                      <button onClick={() => setHomeTab('online')} className={`px-2 py-1 rounded text-xs font-medium ${homeTab === 'online' ? 'bg-[#404249] text-white' : 'text-[#B5BAC1] hover:text-white'}`}>Online</button>
                      <button onClick={() => setHomeTab('all')} className={`px-2 py-1 rounded text-xs font-medium ${homeTab === 'all' ? 'bg-[#404249] text-white' : 'text-[#B5BAC1] hover:text-white'}`}>Todos</button>
                      <button onClick={() => setHomeTab('add')} className="px-2.5 py-1 rounded text-xs font-medium text-white" style={{ backgroundColor: currentAccentHex }}>Adicionar amigo</button>
                    </div>
                  )
                ) : (
                  <div className="flex items-center gap-2 min-w-0">
                    <LucideIcon name="Hash" className="w-5 h-5 text-[#80848E]" />
                    <span className="font-bold text-white text-sm truncate">{activeChannel?.name || 'geral'}</span>
                  </div>
                )}
              </div>

              <button onClick={() => copyToClipboard(userProfile.fullHandle, `Copiado: ${userProfile.fullHandle}`)} className="hidden sm:flex items-center gap-1.5 bg-[#1E1F22] hover:bg-[#2B2D31] px-2.5 py-1 rounded text-xs text-[#B5BAC1] hover:text-white">
                <span className="font-mono">{userProfile.fullHandle}</span>
                <LucideIcon name="Copy" className="w-3.5 h-3.5" />
              </button>
            </header>

            {viewMode === 'home' && homeTab !== 'dm' ? (
              <div className="flex-1 overflow-y-auto p-6">
                {homeTab === 'add' && (
                  <div className="max-w-xl">
                    <h2 className="text-base font-bold uppercase text-white">Adicionar amigo</h2>
                    <p className="text-xs text-[#B5BAC1] mt-1">Seu identificador: <span className="font-mono text-white">{userProfile.fullHandle}</span></p>
                    <form onSubmit={handleSendFriendRequest} className="mt-4 bg-[#1E1F22] rounded-lg px-3 py-2 flex items-center gap-2">
                      <input type="text" required value={friendQuery} onChange={(e) => setFriendQuery(e.target.value)} placeholder="Nome de usuário#tag" className="flex-1 bg-transparent text-sm text-white outline-none" />
                      <button type="submit" className="px-4 py-1.5 rounded text-white text-xs font-medium" style={{ backgroundColor: currentAccentHex }}>Enviar pedido</button>
                    </form>
                    {friendFeedback && <p className={`mt-2 text-xs ${friendFeedback.isError ? 'text-[#F23F43]' : 'text-[#23A55A]'}`}>{friendFeedback.text}</p>}
                  </div>
                )}

                {(homeTab === 'online' || homeTab === 'all') && (
                  <div className="max-w-2xl">
                    <h3 className="text-xs font-bold uppercase text-[#949BA4] mb-3">{homeTab === 'online' ? `Online — ${onlineFriendsList.length}` : `Todos — ${friendsList.length}`}</h3>
                    {(homeTab === 'online' ? onlineFriendsList : friendsList).map((friend) => (
                      <div key={friend.uid} className="py-2.5 px-2 rounded-lg hover:bg-[#393C41]/40 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <UserAvatar profile={friend} size="md" showStatus accentHex={currentAccentHex} />
                          <div>
                            <div className="text-sm font-bold text-white">{friend.displayName}</div>
                            <div className="text-xs text-[#949BA4]">{STATUS_CONFIG[friend.status || 'online']?.label}</div>
                          </div>
                        </div>
                        <button onClick={() => { setActiveFriendUid(friend.uid); setHomeTab('dm'); }} className="p-2 rounded-full bg-[#2B2D31] text-white"><LucideIcon name="MessageSquare" className="w-4 h-4" /></button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <>
                <div className="flex-1 overflow-y-auto px-4 py-4 space-y-4 select-text">
                  {messages.map((msg) => {
                    const senderProfile = allUsers.find((u) => u.uid === msg.senderId) || { displayName: 'Usuário' };
                    return (
                      <div key={msg.id} className="group flex items-start gap-4 py-1 px-2 rounded hover:bg-[#2E3035]/50">
                        <UserAvatar profile={senderProfile} size="md" accentHex={currentAccentHex} />
                        <div className="flex-1 min-w-0">
                          <div className="flex items-baseline gap-2">
                            <span className="font-semibold text-sm text-white">{senderProfile.displayName}</span>
                            <span className="text-[11px] text-[#949BA4]">{formatTimestamp(msg.createdAt || msg.clientTimestamp)}</span>
                          </div>
                          {msg.text && <p className="text-sm text-[#DBDEE1] break-words">{msg.text}</p>}
                        </div>
                      </div>
                    );
                  })}
                  <div ref={chatEndRef} />
                </div>

                {/* BARRA DE INPUT DO CHAT */}
                <div className="px-4 pb-5 pt-1 relative">
                  <form onSubmit={handleSendMessage} className="rounded-lg px-4 py-2.5 flex items-center gap-3" style={{ backgroundColor: activeTheme.bgInput }}>
                    <input type="text" value={messageInput} onChange={(e) => setMessageInput(e.target.value)} placeholder="Conversar no Doors.cord..." className="flex-1 bg-transparent text-sm text-white outline-none" />
                    <button type="submit" className="text-[#B5BAC1] hover:text-white"><LucideIcon name="Send" className="w-5 h-5" /></button>
                  </form>
                </div>
              </>
            )}
          </main>

          {/* MODAL DE CONFIGURAÇÕES */}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-[#313338] w-full max-w-2xl rounded-lg overflow-hidden shadow-2xl flex h-[480px]">
                <div className="w-44 bg-[#2B2D31] p-3 flex flex-col gap-1">
                  <button onClick={() => setSettingsTab('profile')} className={`text-left px-2.5 py-2 rounded text-sm ${settingsTab === 'profile' ? 'bg-[#404249] text-white' : 'text-[#949BA4]'}`}>Meu Perfil</button>
                  <button onClick={() => setSettingsTab('appearance')} className={`text-left px-2.5 py-2 rounded text-sm ${settingsTab === 'appearance' ? 'bg-[#404249] text-white' : 'text-[#949BA4]'}`}>Temas & Cores</button>
                  <button onClick={() => setShowSettingsModal(false)} className="mt-auto text-left px-2.5 py-2 rounded text-sm text-[#F23F43]">Fechar</button>
                </div>

                <div className="flex-1 overflow-y-auto p-6">
                  {settingsTab === 'profile' && (
                    <form onSubmit={handleSaveProfile} className="space-y-4">
                      <h3 className="text-lg font-bold text-white">Perfil do Usuário</h3>
                      <div className="flex items-center gap-4">
                        <UserAvatar profile={{ ...userProfile, avatarDataUrl: editAvatarDataUrl }} size="lg" accentHex={currentAccentHex} />
                        <input ref={avatarFileInputRef} type="file" accept="image/*" onChange={handleAvatarUploadFromPC} className="hidden" />
                        <button type="button" onClick={() => avatarFileInputRef.current?.click()} className="px-4 py-2 rounded text-white text-xs font-medium" style={{ backgroundColor: currentAccentHex }}>
                          {uploadingAvatar ? 'Carregando...' : 'Foto do Computador'}
                        </button>
                      </div>
                      <input type="text" value={editDisplayName} onChange={(e) => setEditDisplayName(e.target.value)} className="w-full bg-[#1E1F22] rounded px-3 py-2 text-sm text-white outline-none" />
                      <button type="submit" className="px-5 py-2 rounded text-white text-xs font-medium" style={{ backgroundColor: currentAccentHex }}>Salvar</button>
                    </form>
                  )}

                  {settingsTab === 'appearance' && (
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-white">Temas Grátis</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {Object.values(THEMES).map((t) => (
                          <button key={t.id} onClick={() => setCurrentThemeKey(t.id)} className={`p-3 rounded border text-left text-sm font-semibold ${currentThemeKey === t.id ? 'border-white bg-[#404249]/40' : 'border-[#3F4147] bg-[#2B2D31]'}`}>
                            {t.name}
                          </button>
                        ))}
                      </div>
                      <div className="flex gap-2">
                        {ACCENT_COLORS.map((ac) => (
                          <button key={ac.id} onClick={() => setCurrentAccentHex(ac.hex)} className="w-8 h-8 rounded-full" style={{ backgroundColor: ac.hex }} />
                        ))}
                      </div>
                      <button onClick={handleSaveProfile} className="px-5 py-2 rounded text-white text-xs font-medium" style={{ backgroundColor: currentAccentHex }}>Aplicar Tema</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL SERVIDOR */}
          {showServerModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-[#313338] w-full max-w-md rounded-lg p-6">
                <div className="flex justify-between mb-4">
                  <h3 className="text-lg font-bold text-white">Criar Servidor</h3>
                  <button onClick={() => setShowServerModal(false)}><LucideIcon name="X" className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleCreateServer} className="space-y-4">
                  <input type="text" required value={newServerName} onChange={(e) => setNewServerName(e.target.value)} placeholder="Nome do Servidor" className="w-full bg-[#1E1F22] rounded px-3 py-2.5 text-sm text-white outline-none" />
                  <button type="submit" className="w-full py-2.5 rounded text-white text-sm font-medium" style={{ backgroundColor: currentAccentHex }}>Criar</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    window.startDoorsCordApp = function() {
      const sdk = window.FirebaseSDK;
      if (!sdk) return;

      const firebaseConfig = typeof __firebase_config !== 'undefined'
        ? JSON.parse(__firebase_config)
        : {
            apiKey: "demo-key",
            authDomain: "demo.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
          };

      const app = sdk.initializeApp(firebaseConfig);
      const auth = sdk.getAuth(app);
      const db = sdk.getFirestore(app);
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'doorscord-realtime-br-v2';

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App fb={{ ...sdk, auth, db, appId, isConfigured: Boolean(window.__firebaseLoaded) }} />);
    };

    if (window.__firebaseLoaded) {
      window.startDoorsCordApp();
    }
  </script>
</body>
</html>
